[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = "/migrations/"

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "S", "C4", "SIM"]
ignore = ["E501"]  # line length is Black's job

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]  # assert and test passwords
"config/settings/*" = ["F403", "F405"]    # from .base import *

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --ds=config.settings.test"